<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画纸上的苹果</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f1e6;
    --ink: #282a23;
    --muted: #595449;
    --rule: #a59b89;
    --red: #8b3026;
    --wash: #ebdfcc;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }

  main {
    width: min(100%, 1080px);
    margin-inline: auto;
    padding: 48px clamp(22px, 5vw, 64px) 56px;
  }

  header {
    border-top: 3px solid var(--ink);
    padding-block: 18px 21px;
  }

  h1, h2 {
    margin: 0;
    font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
  }

  h1 {
    color: var(--red);
    font-size: clamp(40px, 8vw, 80px);
    line-height: 1.15;
  }

  header p {
    margin: 12px 0 0;
    font-size: 1rem;
  }

  .exhibit {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(240px, 0.52fr);
    align-items: start;
    gap: clamp(28px, 5vw, 66px);
  }

  .plates {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
    align-items: start;
    column-gap: clamp(12px, 3vw, 32px);
  }

  figure { margin: 0; }
  figure + figure { margin-top: 30px; }

  figure img {
    display: block;
    width: 100%;
    height: auto;
    background: var(--wash);
  }

  .exhibit[data-selected="baldwin"] #baldwin img,
  .exhibit[data-selected="adirondack"] #adirondack img {
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  figcaption {
    padding-top: 9px;
    color: var(--muted);
    font-size: 0.875rem;
    line-height: 1.5;
  }

  figcaption strong {
    display: block;
    color: var(--ink);
    font: 700 1.15rem/1.3 Georgia, serif;
  }

  .source {
    grid-column: 1 / -1;
    margin: 15px 0 0;
    font-size: 0.8125rem;
    color: var(--muted);
  }

  .catalog {
    border-top: 1px solid var(--rule);
    padding-top: 11px;
  }

  fieldset {
    min-width: 0;
    margin: 0 0 12px;
    padding: 0;
    border: 0;
  }

  legend {
    padding: 0;
    margin-bottom: 7px;
    font-weight: 700;
  }

  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 9px;
    min-height: 44px;
    border: 1px solid var(--rule);
    cursor: pointer;
    font-family: Georgia, serif;
  }

  label:has(input:checked) {
    border-color: var(--red);
    background: var(--wash);
  }

  input {
    margin: 0;
    accent-color: var(--red);
  }

  button {
    min-height: 44px;
    padding: 8px 18px;
    border: 1px solid var(--red);
    background: var(--red);
    color: white;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .record {
    margin-top: 20px;
    padding: 13px 14px 8px;
    border-top: 2px solid var(--red);
    background: var(--wash);
  }

  h2 { font-size: 1.2rem; }
  dl { margin: 7px 0 0; }

  dl > div {
    display: grid;
    grid-template-columns: 3.1em minmax(0, 1fr);
    gap: 6px;
    padding-block: 5px;
    border-top: 1px solid var(--rule);
  }

  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }

  @media (max-width: 680px) {
    main { padding-top: 22px; }
    .exhibit { grid-template-columns: minmax(0, 1fr); gap: 21px; }
    figure + figure { margin-top: 17px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>画纸上的苹果</h1>
    <p>看看完整苹果的轮廓，再找找切面里露出的种子。</p>
  </header>

  <div class="exhibit" data-selected="baldwin">
    <div class="plates">
      <figure id="baldwin">
        <img src="../assets/baldwin.jpg" width="960" height="1446"
             alt="Baldwin 水彩原图。两颗完整苹果上下排列，上面一颗通红，下面一颗红中带绿。画纸四周留有手写记录。">
        <figcaption><strong lang="en">Baldwin</strong>两颗完整果</figcaption>
      </figure>
      <figure id="adirondack">
        <img src="../assets/adirondack.jpg" width="960" height="1455"
             alt="Adirondack 水彩原图。上面是带红色条纹的完整苹果，下面的纵切面露出果心和种子。画纸下缘留有手写记录。">
        <figcaption><strong lang="en">Adirondack</strong>完整果与纵切面</figcaption>
      </figure>
      <p class="source">图源为美国农业部（USDA）公开档案。</p>
    </div>

    <div class="catalog">
      <form id="picker">
        <fieldset>
          <legend>选一幅画</legend>
          <div class="choices">
            <label><input type="radio" name="plate" value="baldwin" checked> <span lang="en">Baldwin</span></label>
            <label><input type="radio" name="plate" value="adirondack"> <span lang="en">Adirondack</span></label>
          </div>
        </fieldset>
        <button type="submit" aria-controls="record" aria-expanded="false">查看档案</button>
      </form>

      <section class="record" id="record" aria-labelledby="record-title" hidden>
        <div aria-live="polite" aria-atomic="true">
          <h2 id="record-title" tabindex="-1"><span id="record-name" lang="en"></span> 档案</h2>
          <dl>
            <div><dt>画家</dt><dd id="artist" lang="en"></dd></div>
            <div><dt>年份</dt><dd id="year"></dd></div>
            <div><dt>编号</dt><dd id="accession"></dd></div>
          </dl>
        </div>
      </section>
    </div>
  </div>
</main>
<script>
  const records = {
    baldwin: {
      name: "Baldwin",
      artist: "Ellen Isham Schutt",
      year: "1909",
      accession: "POM00001363"
    },
    adirondack: {
      name: "Adirondack",
      artist: "Deborah Griscom Passmore",
      year: "1893",
      accession: "POM00001337"
    }
  };

  const picker = document.querySelector("#picker");
  const exhibit = document.querySelector(".exhibit");
  const record = document.querySelector("#record");
  const button = picker.querySelector("button");

  function updateRecord() {
    const selected = picker.elements.plate.value;
    const details = records[selected];
    exhibit.dataset.selected = selected;
    document.querySelector("#record-name").textContent = details.name;
    document.querySelector("#artist").textContent = details.artist;
    document.querySelector("#year").textContent = `${details.year} 年`;
    document.querySelector("#accession").textContent = details.accession;
  }

  picker.addEventListener("change", updateRecord);
  picker.addEventListener("submit", (event) => {
    event.preventDefault();
    updateRecord();
    record.hidden = false;
    button.setAttribute("aria-expanded", "true");
    document.querySelector("#record-title").focus();
  });

  updateRecord();
</script>
</body>
</html>
