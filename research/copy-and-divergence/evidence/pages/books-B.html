<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>周末取绘本</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf7ee;
      --ink: #20382e;
      --muted: #536258;
      --line: #d5d7c7;
      --green: #28513e;
      --wash: #edf0e3;
      --serif: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
    }
    button { font: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid #8d4b24; outline-offset: 4px; }

    .page {
      width: min(calc(100% - 88px), 1120px);
      margin-inline: auto;
      padding: 43px 0 28px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }
    .top-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .875rem;
      font-weight: 700;
    }
    .book-mark {
      position: relative;
      width: 21px;
      height: 15px;
      border: 1.5px solid currentColor;
      border-radius: 2px 4px 2px 2px;
      transform: rotate(-8deg);
    }
    .book-mark::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 50%;
      border-left: 1.5px solid currentColor;
    }
    .demo { color: var(--muted); font-size: .82rem; }

    .intro { padding: 37px 0 32px; }
    h1, h2, p { margin: 0; }
    h1 {
      font: 700 clamp(2.9rem, 7vw, 5rem)/1.16 var(--serif);
      letter-spacing: .035em;
    }
    .intro p { margin-top: 13px; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
      gap: clamp(27px, 5vw, 68px);
      align-items: start;
    }
    .shelf h2 {
      margin-bottom: 12px;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .books {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    .books li { border-bottom: 1px solid var(--line); }
    .book {
      display: grid;
      grid-template-columns: 53px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 107px;
      padding: 15px 12px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: background-color .18s ease;
    }
    .book:hover, .book[aria-pressed="true"] { background: var(--wash); }
    .book[aria-pressed="true"] { box-shadow: inset 3px 0 var(--green); }
    .book-title {
      display: block;
      font: 700 clamp(1.17rem, 2.25vw, 1.5rem)/1.28 var(--serif);
      overflow-wrap: anywhere;
    }
    .book-place {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .83rem;
    }
    .arrow { font-size: 1.25rem; text-align: right; }
    .cover {
      position: relative;
      display: block;
      width: 49px;
      height: 66px;
      overflow: hidden;
      border-radius: 2px 5px 5px 2px;
      box-shadow: inset 4px 0 #233b3529, 1px 2px 2px #20382e24;
    }
    .river {
      background:
        radial-gradient(circle at 68% 24%, #f7e7ab 0 6px, transparent 7px),
        linear-gradient(155deg, transparent 48%, #d5e7d7 49% 62%, transparent 63%),
        linear-gradient(25deg, #3b6360 37%, #86a59a 38% 54%, #a5c3ae 55%);
    }
    .street { background: #e8bc83; }
    .street::before, .street::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 12px;
      border: 2px solid #704832;
      border-bottom: 0;
      border-radius: 10px 10px 0 0;
      background: #d79064;
    }
    .street::before { height: 31px; left: 9px; }
    .street::after { height: 42px; right: 8px; }

    .pickup {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px 4px 17px 17px;
      background: #fffdf6;
    }
    .scene {
      position: relative;
      margin: 8px 8px 0;
      overflow: hidden;
      background: #e7ebd9;
      border-radius: 2px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 620 / 265;
    }
    .scene figcaption {
      position: absolute;
      right: 10px;
      bottom: 8px;
      padding: 2px 8px;
      background: #faf7ee;
      color: var(--muted);
      font-size: .72rem;
    }
    .pickup-body { padding: 20px 25px 24px; }
    .pickup h2 {
      font: 700 clamp(1.42rem, 3vw, 2rem)/1.3 var(--serif);
      letter-spacing: .025em;
    }
    .hint, .route {
      margin-top: 7px;
      color: var(--muted);
      font-size: .94rem;
    }
    .pickup-time {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      background: #f4e8ca;
      color: #594124;
      font-size: .9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .route { margin-top: 12px; }
    .save {
      min-height: 44px;
      margin-top: 17px;
      padding: 8px 20px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: var(--green);
      color: #fffdf6;
      font-weight: 700;
      cursor: pointer;
    }
    .save:hover { background: #1b3d2e; }

    .receipt {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      margin: 0 25px 22px;
      padding: 13px 14px;
      background: var(--wash);
      border-left: 2px solid var(--green);
    }
    .check {
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      margin-top: 1px;
      border-radius: 50%;
      color: white;
      background: var(--green);
      font-size: .78rem;
    }
    .receipt p { font-size: .9rem; overflow-wrap: anywhere; }
    .receipt p + p { color: var(--muted); }
    .foot {
      margin-top: 29px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .8rem;
    }

    @media (max-width: 680px) {
      .page { width: calc(100% - 36px); padding-top: 21px; }
      .top { padding-bottom: 12px; }
      .intro { padding: 25px 0 23px; }
      .intro p { margin-top: 9px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 23px; }
      .book { min-height: 80px; padding: 10px 9px; gap: 11px; }
      .cover { width: 42px; height: 55px; }
      .book { grid-template-columns: 44px minmax(0, 1fr) 20px; }
      .pickup { scroll-margin-top: 12px; }
      .pickup-body { padding: 15px 16px 19px; }
      .receipt { margin: 0 16px 17px; }
      .foot { margin-top: 23px; }
    }
    @media (max-width: 350px) {
      h1 { font-size: 2.45rem; }
      .save { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .book { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <span class="top-label"><span class="book-mark" aria-hidden="true"></span> 绘本领取指南</span>
      <span class="demo">演示页面</span>
    </header>

    <div class="intro">
      <h1>周末取绘本</h1>
      <p>选一本，看看周六几点去、怎么走。</p>
    </div>

    <div class="layout">
      <section class="shelf" aria-labelledby="shelf-title">
        <h2 id="shelf-title">按书名查找</h2>
        <ul class="books">
          <li>
            <button class="book" type="button" data-book="river" aria-controls="pickup" aria-pressed="false" aria-labelledby="river-title">
              <span class="cover river" aria-hidden="true"></span>
              <span>
                <span class="book-title" id="river-title">去河边的那天</span>
                <span class="book-place">北门 · 自提架</span>
              </span>
              <span class="arrow" aria-hidden="true">→</span>
            </button>
          </li>
          <li>
            <button class="book" type="button" data-book="street" aria-controls="pickup" aria-pressed="false" aria-labelledby="street-title">
              <span class="cover street" aria-hidden="true"></span>
              <span>
                <span class="book-title" id="street-title">西街十二扇门</span>
                <span class="book-place">服务台</span>
              </span>
              <span class="arrow" aria-hidden="true">→</span>
            </button>
          </li>
        </ul>
      </section>

      <section class="pickup" id="pickup" aria-labelledby="pickup-title">
        <figure class="scene">
          <canvas id="scene" width="1240" height="530" aria-hidden="true"></canvas>
          <figcaption>动线示意</figcaption>
        </figure>
        <div class="pickup-body">
          <h2 id="pickup-title" tabindex="-1">选一本绘本</h2>
          <p id="hint" class="hint">点击左侧或上方的书名，查看领取时段和走法。</p>
          <div id="details" hidden>
            <p class="pickup-time" id="pickup-time"></p>
            <p class="route" id="route"></p>
            <button class="save" id="save" type="button">记入取书单</button>
          </div>
        </div>
        <div id="status" role="status" aria-atomic="true">
          <div class="receipt" id="receipt" hidden>
            <span class="check" aria-hidden="true">✓</span>
            <div>
              <p><strong>已加入取书单</strong></p>
              <p id="saved-title"></p>
            </div>
          </div>
        </div>
      </section>
    </div>
    <footer class="foot">取书单为演示记录。</footer>
  </main>

  <script>
    const books = {
      river: {
        place: "北门 · 自提架",
        time: "周六 10:00–12:00",
        route: "找前面有灰色柱子的北门小门。小门没有台阶，从这里去自提架。"
      },
      street: {
        place: "服务台",
        time: "周六 13:30–16:00",
        route: "去服务台会经过中庭，推童车也能过。"
      }
    };

    const buttons = [...document.querySelectorAll(".book")];
    const pickup = document.getElementById("pickup");
    const heading = document.getElementById("pickup-title");
    const hint = document.getElementById("hint");
    const details = document.getElementById("details");
    const time = document.getElementById("pickup-time");
    const route = document.getElementById("route");
    const receipt = document.getElementById("receipt");
    const savedTitle = document.getElementById("saved-title");
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const compact = window.matchMedia("(max-width: 680px)");
    let selectedTitle = "";

    function drawScene(view) {
      if (!ctx) return;
      ctx.setTransform(2, 0, 0, 2, 0, 0);

      function shape(points, fill, stroke) {
        ctx.beginPath();
        for (const [index, [x, y]] of points.entries()) {
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        if (fill) {
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 2;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();
        }
      }

      function rect(x, y, w, h, fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, w, h);
      }

      function oval(x, y, w, h, fill) {
        ctx.beginPath();
        ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
      }

      rect(0, 0, 620, 265, "#e7ebd9");
      oval(492, 56, 29, 29, "#f6e3a9");
      shape([[0, 168], [78, 141], [154, 150], [254, 135], [345, 154], [489, 137], [620, 155], [620, 265], [0, 265]], "#c8d3b5");
      shape([[0, 222], [106, 204], [224, 208], [358, 184], [518, 176], [620, 182], [620, 265], [0, 265]], "#b6c5a2");

      if (view === "street") {
        shape([[127, 265], [215, 226], [235, 190], [481, 157], [525, 174], [325, 205], [308, 236], [290, 265]], "#f1e6c8");
        for (const x of [208, 284, 360]) {
          rect(x, 91, 57, 86, "#f7efda");
          oval(x + 28.5, 91, 28.5, 27, "#f7efda");
          rect(x + 8, 94, 41, 83, "#acbd9d");
          oval(x + 28.5, 95, 20.5, 20, "#acbd9d");
        }
        rect(474, 120, 60, 45, "#e1b283");
        shape([[469, 120], [539, 120], [539, 128], [469, 128]], "#955d42");
        rect(483, 141, 41, 4, "#f5e4bd");
      } else {
        shape([[104, 265], [196, 233], [277, 218], [309, 185], [332, 169], [366, 178], [349, 208], [364, 228], [298, 265]], "#f1e6c8");
        rect(199, 107, 248, 73, "#f7efda");
        rect(180, 102, 280, 7, "#ac9a76");
        rect(289, 102, 72, 78, "#486653");
        oval(325, 103, 36, 33, "#486653");
        rect(299, 107, 52, 73, "#849d7b");
        oval(325, 108, 26, 25, "#849d7b");
        rect(260, 120, 15, 67, "#7f8883");
        rect(260, 120, 5, 67, "#9ea7a0");
        rect(380, 126, 47, 50, "#aa7653");
        rect(386, 132, 35, 15, "#f4dcad");
        rect(386, 152, 35, 16, "#f4dcad");
        for (const [x, y, color] of [[389, 135, "#6b8871"], [397, 136, "#d69163"], [409, 135, "#858e59"], [390, 156, "#c7825b"], [400, 154, "#668779"], [410, 156, "#9a795d"]]) {
          rect(x, y, 5, 11, color);
        }
      }

      for (const [x, y, size] of [[76, 170, 1], [130, 189, .64], [550, 188, .86]]) {
        rect(x - 2, y - 45 * size, 4, 45 * size, "#796c50");
        oval(x - 9 * size, y - 47 * size, 20 * size, 21 * size, "#718f71");
        oval(x + 10 * size, y - 52 * size, 20 * size, 24 * size, "#89a382");
      }
      for (const [x, y] of [[35, 224], [66, 238], [157, 218], [440, 221], [490, 200], [534, 226], [582, 208]]) {
        shape([[x - 5, y - 6], [x, y], [x + 4, y - 8]], null, "#819877");
        oval(x + 9, y - 1, 2.5, 2.5, "#f4e5b7");
      }
    }

    drawScene("river");

    for (const button of buttons) {
      button.addEventListener("click", () => {
        const key = button.dataset.book;
        const book = books[key];
        selectedTitle = document.getElementById(button.getAttribute("aria-labelledby")).textContent;
        for (const item of buttons) {
          item.setAttribute("aria-pressed", String(item === button));
        }
        heading.textContent = book.place;
        time.textContent = book.time;
        route.textContent = book.route;
        hint.hidden = true;
        details.hidden = false;
        drawScene(key);
        heading.focus({ preventScroll: true });
        if (compact.matches) pickup.scrollIntoView({ block: "start" });
      });
    }

    document.getElementById("save").addEventListener("click", () => {
      savedTitle.textContent = `《${selectedTitle}》`;
      receipt.hidden = false;
      const bounds = receipt.getBoundingClientRect();
      if (bounds.bottom > window.innerHeight || bounds.top < 0) {
        receipt.scrollIntoView({ block: "nearest" });
      }
    });
  </script>
</body>
</html>
