<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>老收音机维修点</title>
  <style>
    :root {
      --paper: #f6f1e6;
      --card: #fffdf7;
      --ink: #252c23;
      --muted: #555c50;
      --green: #234638;
      --line: #cfc8b7;
      --soft-green: #e8efe4;
      --amber: #f0dfb4;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(100% - 48px, 1060px);
      margin-inline: auto;
      padding-block: 36px 44px;
    }

    h1, h2, p, dl, dd { margin: 0; }
    button { font: inherit; }

    .hero {
      min-height: 282px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      align-items: center;
      gap: 24px;
      padding: 34px clamp(24px, 5vw, 58px);
      background: var(--green);
      color: var(--card);
      border-radius: 16px;
    }

    .hero h1 {
      font-family: "Songti SC", SimSun, serif;
      font-size: clamp(2.35rem, 5.8vw, 4.25rem);
      line-height: 1.13;
    }

    .hero p {
      margin-top: 18px;
      color: #e6ece4;
      font-size: 1.03rem;
    }

    .radio {
      position: relative;
      justify-self: center;
      display: grid;
      grid-template-columns: 1.28fr 1fr;
      gap: 12px;
      width: min(100%, 280px);
      height: 132px;
      margin: 42px 0 9px;
      padding: 13px;
      border: 3px solid #503725;
      border-radius: 16px;
      background: #ac7650;
      box-shadow: inset 0 0 0 2px #d59f72, 0 8px 0 #162f25;
    }

    .radio::before {
      content: "";
      position: absolute;
      z-index: 0;
      right: 16px;
      bottom: 100%;
      width: 65%;
      height: 4px;
      border-radius: 4px;
      background: #ecdbb4;
      transform: rotate(17deg);
      transform-origin: right;
    }

    .speaker {
      border: 2px solid #795239;
      border-radius: 8px;
      background: repeating-linear-gradient(to bottom, #554133 0 3px, #d2a576 3px 7px);
      box-shadow: inset 0 0 0 5px #d2a576;
    }

    .tuning {
      display: grid;
      align-content: space-between;
      justify-items: center;
      padding: 9px 7px 7px;
      border: 2px solid #795239;
      border-radius: 8px;
      background: #e8ce9e;
    }

    .scale {
      position: relative;
      width: 100%;
      height: 25px;
      border: 4px solid #3d3c32;
      border-radius: 4px;
      background: repeating-linear-gradient(to right, #f0dfb4 0 2px, #536052 2px 10px);
    }

    .scale::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 57%;
      width: 3px;
      background: #a83823;
    }

    .knobs {
      display: flex;
      gap: 10px;
    }

    .knobs span {
      width: 25px;
      height: 25px;
      border: 2px solid #554133;
      border-radius: 50%;
      background: radial-gradient(circle, #805638 0 34%, #634533 37% 56%, #aa7950 59%);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
      align-items: start;
      gap: 20px;
      margin-top: 20px;
    }

    .panel {
      padding: clamp(20px, 3vw, 32px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    h2 {
      font-size: 1.4rem;
      line-height: 1.35;
    }

    .intro {
      margin-top: 7px;
      color: var(--muted);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .choice {
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid #8a9384;
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font-weight: 650;
      text-align: left;
    }

    .choice::before {
      display: inline-block;
      width: .85em;
      height: .85em;
      margin-right: .55em;
      border: 1px solid currentColor;
      border-radius: 50%;
      vertical-align: -.03em;
      content: "";
    }

    .choice:hover, .choice[aria-pressed="true"] {
      background: var(--soft-green);
      border-color: var(--green);
      color: var(--green);
    }

    .choice[aria-pressed="true"]::before {
      background: var(--green);
      box-shadow: inset 0 0 0 2px var(--soft-green);
    }

    button:focus-visible, .result:focus {
      outline: 3px solid #8c441e;
      outline-offset: 4px;
    }

    .details {
      margin-top: 16px;
      padding: 15px;
      border-left: 4px solid var(--green);
      border-radius: 0 8px 8px 0;
      background: var(--soft-green);
    }

    .details p + p { margin-top: 5px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px 14px;
      margin-top: 16px;
    }

    .submit {
      min-height: 46px;
      padding: 8px 18px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font-weight: 650;
    }

    .submit:hover { background: #335d4c; }

    .demo {
      color: var(--muted);
      font-size: .9rem;
    }

    .result {
      margin-top: 16px;
      padding: 13px 15px;
      border: 1px solid #9bac98;
      border-radius: 8px;
      background: var(--soft-green);
      scroll-margin-block: 18px;
    }

    .result strong { display: block; }

    .visit h2 { margin-bottom: 16px; }
    .visit dl > div + div {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
    }

    .visit dt {
      color: var(--muted);
      font-size: .9rem;
    }

    .visit dd {
      margin-top: 3px;
      font-weight: 650;
    }

    .time { font-variant-numeric: tabular-nums; }

    .bell {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--amber);
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 28px, 540px);
        padding-block: 14px 28px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 0;
        min-height: auto;
        padding-block: 28px 24px;
      }

      .hero p { margin-top: 10px; }

      .radio {
        width: min(100%, 225px);
        height: 108px;
        margin-top: 31px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 12px;
      }
    }

    @media (max-width: 365px) {
      .choices { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <h1>老收音机维修点</h1>
        <p>在菜场东门内。先说说收音机出了什么问题。</p>
      </div>
      <div class="radio" aria-hidden="true">
        <div class="speaker"></div>
        <div class="tuning">
          <div class="scale"></div>
          <div class="knobs"><span></span><span></span></div>
        </div>
      </div>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="check-heading">
        <h2 id="check-heading">收音机怎么了？</h2>
        <p class="intro">免费检查外观。拆机检测前要征得你的同意。</p>
        <form id="check-form">
          <div class="choices" role="group" aria-label="选择收音机的现象">
            <button class="choice" type="button" aria-pressed="false" aria-controls="check-details">完全没声音</button>
            <button class="choice" type="button" aria-pressed="false" aria-controls="check-details">只有杂音</button>
          </div>

          <div class="details" id="check-details" hidden>
            <p><strong id="condition"></strong></p>
            <p id="condition-note"></p>
          </div>

          <div class="actions" id="check-actions" hidden>
            <button class="submit" type="submit" aria-describedby="demo-note">申请检查</button>
            <p class="demo" id="demo-note">本页仅记录演示检查请求。</p>
          </div>
        </form>

        <div class="result" id="check-result" role="status" tabindex="-1" hidden>
          <strong>已记录检查请求</strong>
          <p>所选现象：<span id="recorded-symptom"></span></p>
        </div>
      </section>

      <section class="panel visit" aria-labelledby="visit-heading">
        <h2 id="visit-heading">到店怎么走</h2>
        <dl>
          <div>
            <dt>登记截止</dt>
            <dd>周六 <time class="time" datetime="15:30">15:30</time></dd>
          </div>
          <div>
            <dt>位置</dt>
            <dd>菜场东门内，走过两级台阶。</dd>
          </div>
        </dl>
        <p class="bell">不能走台阶，可以按门铃，有人来接。</p>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("check-form");
    const choices = form.querySelectorAll(".choice");
    const details = document.getElementById("check-details");
    const condition = document.getElementById("condition");
    const conditionNote = document.getElementById("condition-note");
    const actions = document.getElementById("check-actions");
    const result = document.getElementById("check-result");
    const recordedSymptom = document.getElementById("recorded-symptom");

    const instructions = {
      "完全没声音": ["需要先做检测。", "检测前无法承诺价格。"],
      "只有杂音": ["可以先检查旋钮。", ""]
    };

    let selectedSymptom = "";

    for (const choice of choices) {
      choice.addEventListener("click", () => {
        const symptom = choice.textContent.trim();
        if (symptom === selectedSymptom) return;

        selectedSymptom = symptom;
        for (const option of choices) {
          option.setAttribute("aria-pressed", String(option === choice));
        }

        const [summary, note] = instructions[symptom];
        condition.textContent = summary;
        conditionNote.textContent = note;
        conditionNote.hidden = !note;
        details.hidden = false;
        actions.hidden = false;
        result.hidden = true;
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!selectedSymptom) return;

      recordedSymptom.textContent = selectedSymptom;
      result.hidden = false;
      result.focus();
    });
  </script>
</body>
</html>
