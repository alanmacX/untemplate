<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>周末散步，桥边怎么走？</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf6eb;
      --ink: #24372c;
      --muted: #4d5c50;
      --rule: #c8c9b7;
      --green: #285b43;
      --green-dark: #174531;
      --rust: #873c2b;
      --map: #e8ecda;
      --river: #c7dcdb;
      --water-line: #a3c1bf;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-size: 1rem;
      line-height: 1.65;
    }

    main {
      width: min(100% - 5rem, 71rem);
      margin-inline: auto;
      padding-block: clamp(2.25rem, 7vw, 6rem) clamp(2.5rem, 6vw, 4.5rem);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      gap: clamp(2rem, 6vw, 6rem);
      align-items: start;
    }

    .message {
      border-block-start: 3px solid var(--green);
      padding-block-start: clamp(1rem, 3vw, 2rem);
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
      font-size: clamp(2.45rem, 5.5vw, 4.65rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .headline-line { display: block; }

    .intro {
      max-width: 24em;
      margin: 1.35rem 0 0;
      font-size: clamp(1rem, 1.35vw, 1.125rem);
    }

    .closed-text {
      color: var(--rust);
      font-weight: 700;
    }

    .route-form { margin-block-start: 1.5rem; }

    .route-button {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 2.75rem;
      min-height: 3.25rem;
      max-width: 100%;
      padding: .65rem 1rem .65rem 1.15rem;
      border: 2px solid transparent;
      border-radius: .35rem;
      background: var(--green);
      color: #fffdf3;
      font: inherit;
      font-weight: 700;
      text-align: start;
      cursor: pointer;
      transition: background-color .15s ease;
    }

    .route-button:hover,
    .route-button:active { background: var(--green-dark); }

    .route-button:focus-visible {
      outline: 3px solid var(--green-dark);
      outline-offset: 4px;
    }

    .button-arrow {
      position: relative;
      width: 1.15rem;
      height: 2px;
      flex: none;
      background: currentColor;
    }

    .button-arrow::after {
      position: absolute;
      right: 0;
      top: 50%;
      width: .52rem;
      height: .52rem;
      border-block-start: 2px solid;
      border-inline-end: 2px solid;
      transform: translateY(-50%) rotate(45deg);
      content: "";
    }

    .route-result {
      max-width: 25rem;
      margin-block-start: .9rem;
      padding: .65rem .85rem;
      border-inline-start: 4px solid var(--green);
      background: #e4eedf;
      color: var(--green-dark);
    }

    .route-result p { margin: 0; }
    .route-result strong { display: block; }

    .route-figure { margin: 0; }

    .map {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 23rem;
      aspect-ratio: 1.32;
      border: 1px solid #aab6a6;
      border-radius: .45rem;
      background:
        radial-gradient(ellipse at 18% 24%, #f1f1e1 0, transparent 54%),
        var(--map);
      --start-x: 23%;
      --end-x: 48%;
      --start-y: 76%;
      --end-y: 23%;
      --trail: #42745a;
      --trail-width: .4rem;
    }

    .map.is-selected {
      --trail: var(--green-dark);
      --trail-width: .58rem;
    }

    .river {
      position: absolute;
      z-index: -1;
      inset: -42% -45% -30% 67%;
      border: 1px solid var(--water-line);
      border-radius: 47% 0 0 55%;
      background: var(--river);
      transform: rotate(-18deg);
    }

    .river::before,
    .river::after {
      position: absolute;
      inset: 5% 0 7% 8%;
      border-inline-start: 1px solid var(--water-line);
      border-radius: 49%;
      content: "";
    }

    .river::after { inset: 10% 0 13% 15%; }

    .trail {
      position: absolute;
      top: var(--end-y);
      left: var(--start-x);
      width: calc(var(--end-x) - var(--start-x) + var(--trail-width) / 2);
      height: calc(var(--start-y) - var(--end-y) + var(--trail-width) / 2);
      border-inline-end: var(--trail-width) solid var(--trail);
      border-block-end: var(--trail-width) solid var(--trail);
      border-end-end-radius: clamp(1.5rem, 5vw, 3.25rem);
    }

    .point {
      position: absolute;
      z-index: 1;
      width: .9rem;
      height: .9rem;
      border: 3px solid var(--trail);
      border-radius: 50%;
      background: var(--paper);
      transform: translate(-50%, -50%);
    }

    .is-selected .point {
      background: var(--trail);
      box-shadow: 0 0 0 3px var(--paper);
    }

    .start-point { left: var(--start-x); top: var(--start-y); }
    .end-point { left: var(--end-x); top: var(--end-y); }

    .map-label {
      position: absolute;
      white-space: nowrap;
      font-weight: 700;
      line-height: 1.35;
    }

    .start-label {
      left: var(--start-x);
      top: calc(var(--start-y) + .9rem);
      transform: translateX(-50%);
    }

    .end-label {
      left: var(--end-x);
      bottom: calc(100% - var(--end-y) + .95rem);
      transform: translateX(-50%);
    }

    .ramp-label {
      top: 46%;
      right: calc(100% - var(--end-x) + 1rem);
      color: var(--green-dark);
    }

    .stairs {
      position: absolute;
      top: 54%;
      left: 58%;
      right: 4%;
      display: grid;
      justify-items: center;
      gap: .35rem;
      color: var(--rust);
      text-align: center;
      line-height: 1.35;
    }

    .stairs-symbol {
      position: relative;
      display: block;
      width: 2.8rem;
      height: 2rem;
      border: 1px solid currentColor;
      border-radius: .15rem;
      background: repeating-linear-gradient(
        to bottom,
        #f5e5d5 0 .37rem,
        #c79581 .37rem .43rem
      );
    }

    .stairs-symbol::after {
      position: absolute;
      top: 50%;
      left: -.18rem;
      width: 3.15rem;
      height: 3px;
      background: currentColor;
      transform: rotate(-34deg);
      content: "";
    }

    .stairs small {
      display: block;
      margin-block-start: .1rem;
      font-size: .875rem;
    }

    figcaption {
      margin-block-start: .6rem;
      color: var(--muted);
      font-size: .875rem;
      text-align: end;
    }

    .notes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .9rem 2.5rem;
      margin: clamp(1.75rem, 4vw, 3rem) 0 0;
      padding-block: 1.1rem;
      border-block: 1px solid var(--rule);
    }

    .notes > div {
      display: flex;
      flex-wrap: wrap;
      align-content: start;
      gap: .15rem .65rem;
    }

    .notes dt { font-weight: 750; }
    .notes dd { margin: 0; color: var(--muted); }

    @media (max-width: 46rem) {
      main { width: min(100% - 3rem, 34rem); }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
      .headline-line { display: inline; }
      .intro { margin-block-start: .95rem; }
      .route-form { margin-block-start: 1rem; }
      .map { min-height: 17rem; aspect-ratio: 1.3; }
      .notes { grid-template-columns: 1fr; }
    }

    @media (max-width: 25rem) {
      main { width: calc(100% - 2rem); }
      .headline-line { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      .route-button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="layout">
      <section class="message" aria-labelledby="page-title">
        <h1 id="page-title"><span class="headline-line">周末散步，</span><span class="headline-line">桥边怎么走？</span></h1>
        <p class="intro">昨晚下了雨，临河台阶湿滑，<strong class="closed-text">暂时封闭</strong>。从西口绕上斜坡，就能走到桥北。</p>

        <form class="route-form" id="route-form">
          <button class="route-button" type="submit" aria-controls="route-result">
            走斜坡<span class="button-arrow" aria-hidden="true"></span>
          </button>
        </form>

        <div id="route-result" role="status" aria-atomic="true"></div>
        <template id="route-result-content">
          <div class="route-result">
            <p><strong>可以到桥北</strong>从西口上斜坡，沿斜坡走到底。</p>
          </div>
        </template>
      </section>

      <figure class="route-figure">
        <div class="map" id="route-map" role="img" aria-label="从西口沿斜坡可到桥北。临河台阶暂时封闭。">
          <div class="river" aria-hidden="true"></div>
          <div class="trail" aria-hidden="true"></div>
          <span class="point start-point" aria-hidden="true"></span>
          <span class="point end-point" aria-hidden="true"></span>
          <span class="map-label start-label" aria-hidden="true">西口</span>
          <span class="map-label end-label" aria-hidden="true">桥北</span>
          <span class="map-label ramp-label" aria-hidden="true">斜坡</span>
          <div class="stairs" aria-hidden="true">
            <span class="stairs-symbol"></span>
            <span><strong>临河台阶</strong><small>暂时封闭</small></span>
          </div>
        </div>
        <figcaption>位置关系示意</figcaption>
      </figure>
    </div>

    <dl class="notes">
      <div>
        <dt>推手推车</dt>
        <dd>现在只能走斜坡。</dd>
      </div>
      <div>
        <dt>想看桥洞</dt>
        <dd>可以在斜坡尽头停下来看看，那里禁止机动车。</dd>
      </div>
    </dl>
  </main>

  <script>
    const routeForm = document.getElementById('route-form');
    const routeMap = document.getElementById('route-map');
    const routeResult = document.getElementById('route-result');
    const resultContent = document.getElementById('route-result-content');

    routeForm.addEventListener('submit', (event) => {
      event.preventDefault();
      routeMap.classList.add('is-selected');

      if (!routeResult.hasChildNodes()) {
        routeResult.append(resultContent.content.cloneNode(true));
      }
    });
  </script>
</body>
</html>
